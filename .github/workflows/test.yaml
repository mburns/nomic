name: Lua Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**/*.lua'
      - 'test/**/*.lua'
      - '*.rockspec'
  pull_request:
    paths:
      - 'src/**/*.lua'
      - 'test/**/*.lua'
      - '*.rockspec'

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: ./.github/actions/lua-setup
        with:
          install-dev-deps: true
        
      - name: Lint with Luacheck
        run: luacheck src test
        
      - name: Check formatting with StyLua
        run: stylua --check src test
        
      - name: Run tests with coverage
        run: busted -c -o utfTerminal test/*.lua
        
      - name: Generate coverage report
        run: luacov
        
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: luacov.report.out
          
      - name: Check test coverage
        run: |
          coverage=$(grep "Total" luacov.report.out | awk '{print $2}' | tr -d '%')
          if (( $(echo "$coverage < 80" | bc -l) )); then
            echo "Test coverage is below 80%: $coverage%"
            exit 1
          fi
          
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lua-setup
      - name: Install rockspec
        run: luarocks make
