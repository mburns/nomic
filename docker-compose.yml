version: '3'

services:
  app:
    build: .
    volumes:
      - .:/app
    command: make check
  
  test:
    build: .
    volumes:
      - .:/app
    command: make test
  
  lint:
    build: .
    volumes:
      - .:/app
    command: make lint
  
  format:
    build: .
    volumes:
      - .:/app
    command: make format
  
  coverage:
    build: .
    volumes:
      - .:/app
    command: make coverage 